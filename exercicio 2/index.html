<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Carros e Bicicletas</title>
</head>

<body>
  <h1>Carros e Bicicletas</h1>
  <div class="divisao">
    <div>
      <h2 class="produto"><strong>Carro:</strong> <span class="amarelo">R$ 1999</span></h2>
    </div>
    <div>
      <h3>Carro modelo <span class="amarelo">2045</span>, com <span class="amarelo">200Km</span> rodados </h3>
    </div>
    <div>
      <button class="carro"><strong>Comprar Carro</strong></button>
    </div>
  </div>

  <div class="divisao">
    <div>
      <h2 class="produto">Bicicleta: <span class="amarelo">R$ 199</span></h2>
    </div>
    <div>
      <h3>Bicicleta modelo <span class="amarelo">2050</span>, com <span class="amarelo">20Km</span> rodados </h3>
    </div>
    <div>
      <button class="bicicleta"><strong>Comprar Bicicleta</strong></button>
    </div>
  </div>

</body>

</html>
